<html lang="sr">
<head>
<meta charset="utf-8">
<title>Atmos Studio — zakazivanje, klijenti i računi za salone</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#141218">

<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">

<style>
:root{--acc:#ea580c;--bg:#111318;--bg2:#171a21;--card:#1b1f27;--card2:#252a35;--line:rgba(255,255,255,.1);--txt:#f1f3f7;--muted:#9aa3b2;--ok:#34d399;--warn:#fbbf24;--bad:#f87171;--r:14px;--nav:64px}
:root[data-theme=light]{--bg:#f3f4f6;--bg2:#e9ebef;--card:#fff;--card2:#f1f3f6;--line:rgba(20,30,50,.13);--txt:#151a24;--muted:#5d6676;--ok:#059669;--warn:#b45309;--bad:#dc2626}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{margin:0;font-family:Inter,system-ui,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;padding-bottom:calc(var(--nav) + 90px + env(safe-area-inset-bottom))}
body.fs-l{font-size:112%}body.fs-s{font-size:92%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card2);border-radius:12px;padding:10px 14px;font-size:.9rem}
button:active{transform:scale(.98)}
button:disabled{opacity:.45}
.btn-p{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.btn-d{background:rgba(248,113,113,.14);color:var(--bad);border-color:rgba(248,113,113,.4)}
.btn-s{padding:6px 10px;font-size:.8rem;border-radius:10px}
.fld{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:1rem}
.fld:focus{outline:2px solid var(--acc);outline-offset:-1px}
textarea.fld{resize:vertical}
select.fld option{color:#000}
label.l{display:block;font-size:.72rem;color:var(--muted);margin:0 0 4px 2px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top)) 12px 8px}
.top-in{max-width:1100px;margin:auto;display:flex;gap:8px;align-items:center}
.logo{font-weight:800;letter-spacing:.5px;white-space:nowrap}.logo b{color:var(--acc)}
.shopname{flex:1;min-width:0;text-align:right;color:var(--muted);font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shell{max-width:1100px;margin:auto;padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:.95rem;display:flex;justify-content:space-between;align-items:center;gap:8px}
.grid{display:grid;gap:10px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;border-left:4px solid var(--acc)}
.stat small{color:var(--muted);font-size:.72rem;display:block}.stat b{font-size:1.25rem;display:block;margin-top:2px}
.row{display:flex;gap:10px;align-items:center}.sp{justify-content:space-between}.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}
.muted{color:var(--muted)}.small{font-size:.8rem}
.item{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--card);margin-bottom:8px}
.item .amt{font-weight:700;white-space:nowrap;text-align:right}
.item.dim{opacity:.7}
.acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.badge{display:inline-block;padding:3px 8px;border-radius:999px;font-size:.72rem;font-weight:700;white-space:nowrap}
.b-ok{background:rgba(52,211,153,.18);color:var(--ok)}.b-warn{background:rgba(251,191,36,.2);color:var(--warn)}.b-bad{background:rgba(248,113,113,.2);color:var(--bad)}.b-n{background:var(--card2);color:var(--muted)}
.alert{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;margin-bottom:8px;font-size:.9rem}
.alert.bad{background:rgba(248,113,113,.15);border:1px solid rgba(248,113,113,.4)}.alert.warn{background:rgba(251,191,36,.15);border:1px solid rgba(251,191,36,.4)}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bg2);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;border-radius:0;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.66rem;color:var(--muted);height:var(--nav)}
nav button span{font-size:1.3rem}nav button.on{color:var(--acc);font-weight:700}
nav .sec{display:none}
.fab{position:fixed;right:16px;bottom:calc(var(--nav) + 16px + env(safe-area-inset-bottom));z-index:25;width:58px;height:58px;border-radius:50%;background:var(--acc);border:0;color:#fff;font-size:2rem;line-height:1;box-shadow:0 6px 20px rgba(0,0,0,.4);padding:0}
dialog{border:1px solid var(--line);border-radius:20px;background:var(--card);color:var(--txt);width:min(620px,calc(100% - 16px));max-height:94vh;padding:0;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.6)}
.dlg{padding:16px}.dlg h3{margin:0 0 12px}.dlg h4{margin:14px 0 8px}
.toast{position:fixed;left:50%;bottom:calc(var(--nav) + 90px);transform:translateX(-50%);background:#000d;color:#fff;padding:10px 16px;border-radius:12px;z-index:200;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.sw{display:flex;gap:8px;flex-wrap:wrap}.sw button{width:36px;height:36px;border-radius:50%;padding:0;border:3px solid transparent}.sw button.on{border-color:var(--txt)}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px;gap:3px;overflow-x:auto}.seg button{flex:1;border:0;background:none;padding:8px 8px;border-radius:9px;font-size:.82rem;white-space:nowrap}.seg button.on{background:var(--acc);color:#fff;font-weight:600}
table.tb{width:100%;border-collapse:collapse;font-size:.82rem}.tb td,.tb th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right}.tb td:first-child,.tb th:first-child{text-align:left}.tb th{color:var(--muted);font-weight:600;font-size:.72rem}
.more{display:grid;gap:10px}.more button{display:flex;align-items:center;gap:12px;padding:16px;text-align:left;font-size:1rem}
.irow{display:grid;grid-template-columns:auto 70px 1fr auto;gap:6px;margin-bottom:10px;padding:8px;border:1px solid var(--line);border-radius:12px}
.irow .nm{grid-column:1/-1}.irow .fld{padding:8px 10px;font-size:.95rem}
.scban{border:1px dashed var(--acc);border-radius:12px;padding:10px;margin:0 0 12px}.scban .small{margin-bottom:8px}
.scbar{height:8px;border-radius:6px;background:var(--card2);overflow:hidden;margin:14px 0 6px}.scbar i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
details.raw{margin:0 0 12px;font-size:.8rem;color:var(--muted)}details.raw pre{white-space:pre-wrap;max-height:140px;overflow:auto;background:var(--card2);padding:8px;border-radius:8px}
.upd{position:fixed;left:8px;right:8px;top:calc(8px + env(safe-area-inset-top));z-index:150;background:var(--acc);color:#fff;border-radius:14px;padding:10px 12px;display:flex;gap:10px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.upd[hidden]{display:none}.upd button{background:#fff;color:#111;border:0;font-weight:700}
#docView{position:fixed;inset:0;z-index:100;background:#cfd3da;overflow:auto}#docView[hidden]{display:none}
.dtool{position:sticky;top:0;background:#111318;padding:8px 12px;display:flex;gap:8px;z-index:2}
.doc{background:#fff;color:#111;max-width:820px;margin:12px auto;padding:26px;font:13.5px/1.45 Arial,Helvetica,sans-serif;box-shadow:0 4px 20px rgba(0,0,0,.25)}
.doc h1{font-size:22px;margin:0}.doc h2{font-size:13px;margin:14px 0 4px;text-transform:uppercase;color:#444;border-bottom:1px solid #999;padding-bottom:2px}
.doc table{width:100%;border-collapse:collapse}.doc .items th{background:#eee;text-align:left;border:1px solid #999;padding:5px 6px;font-size:12px}.doc .items td{border:1px solid #bbb;padding:5px 6px;vertical-align:top}
.doc .r{text-align:right}.doc .c{text-align:center}.doc .hd{display:flex;justify-content:space-between;gap:20px;border-bottom:2px solid #111;padding-bottom:10px}
.doc .two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.doc .tot{margin-left:auto;width:290px;margin-top:8px}.doc .totrow{display:flex;gap:14px;align-items:flex-start;justify-content:space-between}.doc .ipsqr{display:flex;gap:10px;align-items:center;margin-top:8px;max-width:330px;font-size:11px;line-height:1.35;break-inside:avoid;page-break-inside:avoid}.doc .ipsqr svg{flex:none;width:118px;height:118px}.doc .tot td{padding:3px 6px}.doc .tot .g td{font-weight:700;font-size:15px;border-top:2px solid #111}
.doc .sig{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:46px}.doc .sig div{border-top:1px solid #111;text-align:center;padding-top:4px;font-size:12px}
.doc .st{display:inline-block;border:1.5px solid #111;padding:1px 8px;border-radius:4px;font-weight:700;font-size:12px}
.doc p{margin:4px 0}
@media(max-width:560px){.g4{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr}.doc{padding:14px;margin:0}.doc .two{grid-template-columns:1fr}.doc .tot{width:100%}.doc .totrow{flex-direction:column-reverse}}
@media(min-width:900px){
 body{padding-bottom:30px;padding-left:210px}
 nav{top:0;bottom:0;width:210px;right:auto;flex-direction:column;border-top:0;border-right:1px solid var(--line);padding:70px 8px 8px;overflow-y:auto;gap:2px}
 nav button{flex:none;flex-direction:row;height:46px;font-size:.95rem;gap:12px;padding:0 14px;justify-content:flex-start;border-radius:12px}
 nav .sec{display:flex}nav .morebtn{display:none}
 .top{margin-left:-210px;padding-left:222px}
 .fab{bottom:24px;right:24px}.toast{bottom:30px}
}
@media print{
 @page{size:A4 portrait;margin:12mm}
 body>*:not(#docView){display:none!important}
 body{padding:0!important;background:#fff!important}
 #docView{position:static!important;background:#fff;overflow:visible!important}
 .dtool{display:none!important}
 .doc{box-shadow:none;margin:0;padding:0;max-width:none}
}
/* prijava / režim samo za pregled */
#authBtn{white-space:nowrap}
body.ro #authBtn{border-color:var(--warn);color:var(--warn)}
body.ro .w{display:none!important}
.roBar{background:rgba(251,191,36,.14);color:var(--warn);border:1px solid rgba(251,191,36,.4);border-radius:12px;padding:8px 12px;margin-bottom:12px;font-size:.85rem}
#authDlg::backdrop{background:rgba(0,0,0,.65)}
.supLink{display:inline-block;padding:10px 14px;border:1px solid var(--line);background:var(--card2);border-radius:12px;color:var(--txt);text-decoration:none;font-size:.9rem}
.supLink.wa{background:#25d366;border-color:#25d366;color:#fff;font-weight:600}
.supCard{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;margin:18px 4px 8px;padding-top:12px;border-top:1px solid var(--line);font-size:.82rem}
.supCard a{color:var(--muted);text-decoration:none;white-space:nowrap}.supCard a:hover{color:var(--txt);text-decoration:underline}
body.locked>*:not(dialog):not(script){visibility:hidden!important}
.foot{max-width:1100px;margin:0 auto 12px;padding:0 12px}
.foot-in{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:.85rem}
.foot-in .lic{flex:1;min-width:200px}
.foot-in .lic.warn{color:var(--warn)}.foot-in .lic.bad{color:var(--bad)}
.foot-in .supLink{padding:8px 12px;font-size:.85rem}
.supLink.bad{background:var(--bad);border-color:var(--bad);color:#fff;font-weight:600}
@media print{#appFoot{display:none}}

/* ===== v1.5 — mobilni prikaz, delovi, izveštaji, logo ===== */
html{overflow-x:hidden;max-width:100%}
body{max-width:100vw;overflow-x:clip;touch-action:pan-y pinch-zoom}
.seg,.hscroll{touch-action:pan-x pan-y pinch-zoom}
.top-in{min-width:0}.logo{flex:none;font-size:.95rem}
#authBtn{flex:0 1 auto;min-width:0;max-width:46vw;overflow:hidden;text-overflow:ellipsis}
.grid>*,.row>*,.item>*,.stat,.card,.foot-in>*{min-width:0}
.card{overflow-x:auto}
.fld{min-width:0;max-width:100%}
.stat b{font-size:clamp(1rem,4.4vw,1.25rem);overflow-wrap:anywhere}
.item .grow{overflow-wrap:anywhere}
.item .amt{font-size:.9rem}
.card h3{flex-wrap:wrap}
.dlg{overflow-wrap:anywhere}
.irow{grid-template-columns:78px 66px minmax(0,1fr) auto}
.irow>*{min-width:0}
.irow .fld[data-k=qty]{width:100%!important}
.mrow{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:8px;align-items:center;padding:5px 0;font-size:.85rem}
.mbar{height:10px;border-radius:6px;background:var(--card2);overflow:hidden}.mbar i{display:block;height:100%;background:var(--acc);border-radius:6px}
.mval{text-align:right;white-space:nowrap}
.logoPrev{display:flex;align-items:center;justify-content:center;min-height:90px;border:1px dashed var(--line);border-radius:12px;background:#fff;margin-bottom:10px;padding:8px}
.logoPrev img{max-width:100%;max-height:80px;object-fit:contain}
.btn-v{background:#7360f2;border-color:#7360f2;color:#fff;font-weight:600}
.doc{max-width:100%}
.doc .hd{flex-wrap:wrap}
.doc .hl{display:flex;gap:12px;align-items:center;min-width:0}
.doc .dlogo{max-height:72px;max-width:170px;object-fit:contain}
.doc .sig{break-inside:avoid;page-break-inside:avoid}

@media(max-width:560px){
 .doc .hm{display:none}

 .doc .items th.q{width:38px!important}
 .doc .sig{gap:16px}
}

.dtool{flex-wrap:wrap}

@media print{
 html,body{overflow:visible!important;height:auto!important;max-width:none!important;width:auto!important}

/* ===== Atmos Studio ===== */
:root{--bg:#141218;--bg2:#1a1720;--card:#1f1b26;--card2:#2a2532}
.item[data-act]{cursor:pointer}.stat[data-tab],.stat[data-act]{cursor:pointer}
.av{width:40px;height:40px;border-radius:50%;background:color-mix(in srgb,var(--acc) 30%,var(--card2));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.85rem;flex:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chips button{padding:7px 11px;font-size:.84rem;border-radius:999px}.chips button.btn-p{color:#fff}
.pnav{display:flex;align-items:center;gap:6px;margin-bottom:10px;flex-wrap:wrap}.pnav .lbl{flex:1;text-align:center;min-width:180px;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.wstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:10px}.wstrip button{display:flex;flex-direction:column;align-items:center;padding:6px 2px;gap:0}
.wstrip button small{font-size:.68rem;color:var(--muted)}.wstrip button b{font-size:1.05rem}.wstrip button i{font-style:normal;font-size:.7rem;color:var(--acc);font-weight:700}.wstrip button i.z{color:var(--muted)}
.wstrip button.on{background:var(--acc);border-color:var(--acc);color:#fff}.wstrip button.on small,.wstrip button.on i{color:#fff}.wstrip button.td{outline:2px solid var(--acc);outline-offset:-2px}
.cal{display:flex;border:1px solid var(--line);border-radius:var(--r);background:var(--card);overflow:hidden}
.ctime{width:52px;flex:none;border-right:1px solid var(--line)}.ctime .chl:first-child span{top:0}.ctime .chl span{position:absolute;top:-8px;right:6px;font-size:.7rem;color:var(--muted)}
.ccols{display:flex;flex:1;overflow-x:auto;min-width:0}.ccol{flex:1;min-width:150px;border-right:1px solid var(--line)}.ccol:last-child{border-right:0}
.chd{height:40px;display:flex;align-items:center;gap:6px;padding:0 10px;font-weight:700;font-size:.85rem;border-bottom:3px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:sticky;top:0;background:var(--card);z-index:2}
.chd .dot{width:10px;height:10px;border-radius:50%;flex:none}
.cbody{position:relative;cursor:copy}body.ro .cbody{cursor:default}
.chl{position:absolute;left:0;right:0;border-top:1px solid var(--line)}.chl2{position:absolute;left:0;right:0;border-top:1px dashed color-mix(in srgb,var(--line) 60%,transparent)}
.nowl{position:absolute;left:0;right:0;border-top:2px solid var(--bad);z-index:3}.nowl:before{content:"";position:absolute;left:-4px;top:-5px;width:8px;height:8px;border-radius:50%;background:var(--bad)}
.appt{position:absolute;left:3px;right:3px;border-radius:9px;padding:3px 7px;font-size:.76rem;line-height:1.25;background:color-mix(in srgb,var(--c) 30%,var(--card));border-left:4px solid var(--c);overflow:hidden;cursor:pointer;z-index:1;box-shadow:0 2px 6px #0003}
.appt b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.appt span{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.appt i{position:absolute;right:4px;top:3px;font-style:normal}
.appt.st-otk{opacity:.45;text-decoration:line-through}.appt.st-dosao{background:color-mix(in srgb,var(--ok) 18%,var(--card))}.appt.st-nije{background:color-mix(in srgb,var(--bad) 18%,var(--card))}
.appt:hover{filter:brightness(1.12)}
.irow{grid-template-columns:70px 84px minmax(0,1fr) auto}
@media(max-width:560px){.ccol{min-width:130px}}
</style>

<body>
<div class="top"><div class="top-in"><div class="logo">ATMOS<b>STUDIO</b></div><div class="shopname" id="shopName"></div><button class="btn-s" id="authBtn" type="button"></button></div></div>
<main class="shell" id="view"></main>
<div class="foot" id="appFoot"></div>
<button class="fab" id="fab" aria-label="Dodaj">+</button>
<nav id="nav">
  <button data-tab="pregled"><span>🏠</span>Pregled</button>
  <button data-tab="kalendar"><span>📅</span>Kalendar</button>
  <button data-tab="klijenti"><span>👥</span>Klijenti</button>
  <button data-tab="racuni"><span>🧾</span>Računi</button>
  <button data-tab="usluge" class="sec"><span>✂️</span>Usluge</button>
  <button data-tab="zaposleni" class="sec"><span>💇</span>Zaposleni</button>
  <button data-tab="izvestaji" class="sec"><span>📊</span>Izveštaji</button>
  <button data-tab="korisnici" class="sec admtab" hidden><span>👑</span>Korisnici</button>
  <button data-tab="podesavanja" class="sec"><span>⚙️</span>Podešavanja</button>
  <button data-tab="vise" class="morebtn"><span>☰</span>Više</button>
</nav>
<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>
<dialog id="authDlg"><div class="dlg" id="authBody"></div></dialog>

<script>
/* ---------- SAMO APLIKACIJA (APK / Windows) ----------
   Iz običnog pregledača i PWA prikazuje se ekran za preuzimanje aplikacije.

<script>
'use strict';
if(window.ATMOS_BLOCKED)throw new Error('Atmos Studio: otvori Android ili Windows aplikaciju');
const VER='1.0.0';
let authState='locked'; /* locked = mora prijava; ok = licenca važi; expired = licenca istekla (samo pregled) */
let RO=true;
const $=id=>document.getElementById(id);
const KEY='atmosStudio1';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const num=v=>{const n=parseFloat(String(v??'').replace(',','.'));return isNaN(n)?0:n};
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayStr=()=>ymd(new Date());
const dayDiff=s=>Math.round((new Date(s+'T00:00:00')-new Date(todayStr()+'T00:00:00'))/864e5);
const addD=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return ymd(d)};
const fmtDate=s=>{if(!s)return'—';const p=String(s).split('-');return p.length===3?`${p[2]}.${p[1]}.${p[0]}.`:s};
const fmtN=(n,d)=>(Number(n)||0).toLocaleString('sr-RS',{maximumFractionDigits:d==null?0:d});
const money=n=>{const r=Math.round(num(n)*100)/100;return r.toLocaleString('sr-RS',{minimumFractionDigits:Number.isInteger(r)?0:2,maximumFractionDigits:2})+' RSD'};
/* broj za polje za unos: bez tačke za hiljade (1500 → „1500“, 1.5 → „1,5“) */
const fIn=v=>v===''||v==null?'':String(Math.round(num(v)*100)/100).replace('.',',');
const md=n=>(Math.round(num(n)*100)/100).toLocaleString('sr-RS',{minimumFractionDigits:2,maximumFractionDigits:2});
const MSL=['Januar','Februar','Mart','April','Maj','Jun','Jul','Avgust','Septembar','Oktobar','Novembar','Decembar'];
const DN=['Nedelja','Ponedeljak','Utorak','Sreda','Četvrtak','Petak','Subota'],DS=['Ned','Pon','Uto','Sre','Čet','Pet','Sub'];
const tmin=t=>{const m=/^(\d{1,2}):(\d{2})/.exec(t||'');return m?(+m[1])*60+(+m[2]):0};
const mtime=m=>pad(Math.floor(m/60)%24)+':'+pad(m%60);
const dLabel=s=>{const k=dayDiff(s);const d=new Date(s+'T12:00:00');return(k===0?'Danas':k===1?'Sutra':k===-1?'Juče':DN[d.getDay()])+', '+d.getDate()+'. '+MSL[d.getMonth()].toLowerCase()};
const nName=s=>String(s||'').trim().toLowerCase().replace(/\s+/g,' ');
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'dj');
/* statusi termina */
const AST={zak:{l:'Zakazan',c:'#38bdf8',i:'📅'},dosao:{l:'Završen',c:'#34d399',i:'✅'},otk:{l:'Otkazan',c:'#94a3b8',i:'🚫'},nije:{l:'Nije došao',c:'#f87171',i:'❌'}};
const PAY=['Gotovina','Kartica','Prenos na račun (IPS)','Ostalo'];
const SCOL=['#ec4899','#8b5cf6','#3b82f6','#14b8a6','#22c55e','#eab308','#f97316','#ef4444','#64748b','#a855f7'];

/* ---------- PODACI ---------- */
const DEF_REM='Poštovani {ime}, podsećamo Vas na termin {datum} u {vreme}h{usluge}. {salon}{telefon}';
const DEF_INV='Poštovani {ime}, u prilogu je račun {broj} na iznos {iznos}. Hvala na poverenju! {salon}';
const DEF_SET=()=>({theme:'dark',accent:'#db2777',fs:'m',shop:{name:'',addr:'',city:'',phone:'',email:'',pib:'',mb:'',acc:'',bank:''},pdvRate:0,pdvIncl:true,hourRate:0,
  dayStart:'08:00',dayEnd:'20:00',slot:30,workDays:[1,2,3,4,5,6],cc:'381',msgRem:DEF_REM,msgInv:DEF_INV,invNote:'',ipsQr:true,ipsSf:'289',logo:'',
  backupDays:7,snapKeep:7,lastExport:'',calStaff:'',sig:false});
const COLLS=['clients','services','staff','appts','invoices'];
const fresh=()=>({v:1,settings:DEF_SET(),clients:[],services:[],staff:[],appts:[],invoices:[],counters:{}});
function norm2(d){const s=d.settings||{};d.settings=Object.assign(DEF_SET(),s);d.settings.shop=Object.assign(DEF_SET().shop,s.shop||{});COLLS.forEach(k=>d[k]=Array.isArray(d[k])?d[k].filter(x=>x&&x.id):[]);d.counters=d.counters||{};return d}
function load(){try{const r=JSON.parse(localStorage.getItem(KEY));if(r&&typeof r==='object')return norm2(r)}catch{}return fresh()}
let db=load();
const S=()=>db.settings;
const hasData=()=>COLLS.some(k=>db[k].length);
function persist(){if(RO)return true;try{localStorage.setItem(KEY,JSON.stringify(db));if(typeof gdSoon==='function')gdSoon();return true}catch{toast('Greška pri čuvanju (memorija puna?) — napravi rezervnu kopiju!');return false}}
function save(){persist();updateBadge()}
function nextNo(p){const y=new Date().getFullYear(),k=p+y;db.counters[k]=(db.counters[k]||0)+1;return `${p}-${y}-${String(db.counters[k]).padStart(4,'0')}`}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2800)}
function download(name,text,mime){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:mime}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function setPath(o,p,v){const k=p.split('.');let c=o;while(k.length>1)c=c[k.shift()];c[k[0]]=v}
const cliById=id=>db.clients.find(c=>c.id===id);
const svcById=id=>db.services.find(s=>s.id===id);
const staffById=id=>db.staff.find(s=>s.id===id);
const apptById=id=>db.appts.find(a=>a.id===id);
const invById=id=>db.invoices.find(i=>i.id===id);
const activeStaff=()=>db.staff.filter(s=>!s.off);
const sortA=(a,b)=>a.date.localeCompare(b.date)||tmin(a.time)-tmin(b.time);
const dayAppts=d=>db.appts.filter(a=>a.date===d).sort(sortA);
const apptName=a=>{const c=cliById(a.cid);return c?c.name:(a.cname||'Klijent')};
const apptSvc=a=>(a.svcs||[]).map(id=>(svcById(id)||{}).name).filter(Boolean).join(', ');
const firstName=n=>String(n||'').trim().split(/\s+/)[0]||'';
function age(b){if(!b)return null;const d=new Date(b+'T12:00:00'),n=new Date();let a=n.getFullYear()-d.getFullYear();if(n.getMonth()<d.getMonth()||(n.getMonth()===d.getMonth()&&n.getDate()<d.getDate()))a--;return a>0&&a<120?a:null}
function bdayIn(b){if(!b||b.length<10)return null;const t=todayStr(),y=+t.slice(0,4);for(const yy of[y,y+1]){const k=dayDiff(yy+b.slice(4));if(k>=0)return k}return null}

/* ---------- OBRAČUN RAČUNA ---------- */
function calc(o){
  let sub=0,hours=0,svc=0,prod=0;(o.items||[]).forEach(i=>{const a=num(i.qty)*num(i.price);sub+=a;if(i.kind==='sat')hours+=a;else if(i.kind==='proizvod')prod+=a;else svc+=a});
  const disc=sub*num(o.discount)/100,after=sub-disc,r=num(S().pdvRate)/100;
  let base=after,pdv=0,total=after;
  if(r>0){if(S().pdvIncl){base=after/(1+r);pdv=after-base}else{pdv=after*r;total=after+pdv}}
  return{sub,svc,hours,prod,disc,after,base,pdv,total,r};
}
const invTotal=o=>calc(o).total;
function totHtml(t){const row=(l,v,b)=>`<div class="row sp" style="padding:3px 0;${b?'font-weight:800;font-size:1.1rem;border-top:1px solid var(--line);margin-top:4px;padding-top:6px':''}"><span class="${b?'':'muted'}">${l}</span><span>${v}</span></div>`;
  return row('Zbir stavki',money(t.sub))+(t.disc?row('Popust',' − '+money(t.disc)):'')+(t.r>0?row('Osnovica',money(t.base))+row('PDV '+Math.round(t.r*100)+'%',money(t.pdv)):'')+row('UKUPNO',money(t.total),1)}

/* ---------- UI STANJE ---------- */
const ui={tab:'pregled',q:'',day:todayStr(),rp:'m',rmon:todayStr().slice(0,7),ry:String(new Date().getFullYear()),inv:'all',cf:'all'};
const SEC=['vise','korisnici','usluge','zaposleni','izvestaji','podesavanja'];
const ACCS=['#db2777','#7c3aed','#2563eb','#0891b2','#16a34a','#ea580c','#475569'];
function applyTheme(){const s=S();document.documentElement.dataset.theme=s.theme==='auto'?(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'):s.theme;
  document.documentElement.style.setProperty('--acc',s.accent);document.body.className=(s.fs==='l'?'fs-l':s.fs==='s'?'fs-s':'')+(RO?' ro':'')+(authState==='locked'?' locked':'');
  document.querySelector('meta[name=theme-color]').content=document.documentElement.dataset.theme==='light'?'#f3f4f6':'#141218'}
function go(t){ui.tab=t;ui.q='';render();window.scrollTo(0,0)}
function render(){
  applyTheme();
  $('shopName').textContent=S().shop.name||'';
  $('catList').innerHTML=[...new Set(db.services.map(s=>s.cat).filter(Boolean))].map(c=>`<option value="${esc(c)}">`).join('');
  $('cliList').innerHTML=db.clients.map(c=>`<option value="${esc(c.name)}">${esc(c.phone||'')}</option>`).join('');
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===ui.tab||(b.dataset.tab==='vise'&&SEC.includes(ui.tab)&&innerWidth<900)));
  $('fab').style.display=['pregled','kalendar','klijenti','racuni','usluge','zaposleni'].includes(ui.tab)&&!RO?'block':'none';
  updateBadge();
  document.querySelectorAll('.admtab').forEach(b=>b.hidden=!isAdmin);
  if(ui.tab==='korisnici'&&!isAdmin)ui.tab='pregled';
  const P={korisnici:pgKorisnici,pregled:pgPregled,kalendar:pgKalendar,klijenti:pgKlijenti,racuni:pgRacuni,usluge:pgUsluge,zaposleni:pgZaposleni,izvestaji:pgIzvestaji,vise:pgVise,podesavanja:pgPodesavanja};
  $('view').innerHTML=(RO&&authState==='expired'?`<div class="roBar">⛔ Licenca je istekla — aplikacija radi samo za pregled. <a href="${esc(activationLink())}" target="_blank" rel="noopener" style="color:inherit"><b>Aktivacija</b></a></div>`:'')+P[ui.tab]();
  if(ui.tab==='kalendar')calAfter();
}
let rPend=false;
const typing=()=>{const a=document.activeElement;return!!(a&&a.closest&&a.closest('#view')&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&a.id!=='q')};
function bgRender(){if(typing()){rPend=true;return}rPend=false;render()}
document.addEventListener('focusout',()=>setTimeout(()=>{if(rPend&&!typing())bgRender()},200));
const aBadge=s=>{const x=AST[s]||AST.zak;return`<span class="badge" style="background:${x.c}26;color:${x.c}">${x.i} ${x.l}</span>`};
function updateBadge(){try{if(!navigator.setAppBadge)return;const n=dayAppts(todayStr()).filter(a=>a.status==='zak').length;n?navigator.setAppBadge(n):navigator.clearAppBadge()}catch{}}

/* ---------- KARTICE ---------- */
function apptRow(a,opt){opt=opt||{};const st=staffById(a.staffId),c=cliById(a.cid),inv=a.invId&&invById(a.invId),end=mtime(tmin(a.time)+(num(a.dur)||30));
  return`<div class="item ${a.status==='otk'?'dim':''}" style="border-left:4px solid ${st?st.color:'var(--acc)'}"><div class="grow">
   <div class="row sp"><div><b>${esc(a.time)}–${end}</b> · <b>${esc(apptName(a))}</b>${opt.date?` <span class="muted small">· ${esc(dLabel(a.date))}</span>`:''}</div>${aBadge(a.status)}</div>
   <div class="small muted">${esc(apptSvc(a)||a.note||'—')}${st?' · '+esc(st.name):''}${c&&c.phone?' · 📞 '+esc(c.phone):''}${a.remSent?' · 🔔 podsetnik poslat':''}</div>
   ${inv?`<div class="small" style="margin-top:2px">🧾 ${esc(inv.no)} · ${money(invTotal(inv))} ${inv.paid?'<span class="badge b-ok">Plaćeno</span>':'<span class="badge b-warn">Nije plaćeno</span>'}</div>`:''}
   <div class="acts">${a.status==='zak'?`<button class="btn-s btn-p w" data-act="adone" data-id="${a.id}">✅ Završeno</button><button class="btn-s btn-v" data-act="arem" data-id="${a.id}">🔔 Podsetnik</button>`:''}
    ${a.status==='dosao'&&!inv?`<button class="btn-s btn-p w" data-act="ainv" data-id="${a.id}">🧾 Izdaj račun</button>`:''}${inv?`<button class="btn-s" data-act="invdoc" data-id="${inv.id}">🖨️ Račun</button>`:''}
    <button class="btn-s" data-act="aedit" data-id="${a.id}">✏️</button></div></div></div>`}

function backupBanner(){return backupDue()?`<div class="card" style="border-color:var(--warn)"><h3>💾 Vreme je za rezervnu kopiju</h3><div class="small muted" style="margin:-4px 0 8px">Podaci nisu sačuvani na Google Drive-u ni u kopiji više od ${num(S().backupDays)||7} dana. Poveži Google Drive ili napravi rezervnu kopiju.</div><div class="row wrap"><button class="btn-p grow" data-act="export">💾 Napravi rezervnu kopiju</button><button class="grow" data-tab="podesavanja">☁️ Google Drive</button></div></div>`:''}
function backupDue(){const n=num(S().backupDays);if(!n||!hasData())return false;if(gd.on&&gd.last&&Date.now()-gd.last<n*864e5)return false;const last=S().lastExport;return !last||-dayDiff(last)>=n}

const PXM=1.6; /* piksela po minutu */
function pgKalendar(){const d=ui.day,ws=(()=>{const x=new Date(d+'T12:00:00');x.setDate(x.getDate()-((x.getDay()+6)%7));return ymd(x)})();
  const st=activeStaff(),cols=st.length?st:[{id:'',name:S().shop.name||'Termini',color:'var(--acc)'}];
  const s0=tmin(S().dayStart||'08:00'),s1=Math.max(s0+60,tmin(S().dayEnd||'20:00')),slot=num(S().slot)||30;
  const all=dayAppts(d);let lo=s0,hi=s1;all.forEach(a=>{lo=Math.min(lo,tmin(a.time));hi=Math.max(hi,tmin(a.time)+(num(a.dur)||30))});lo=Math.floor(lo/60)*60;hi=Math.ceil(hi/60)*60;
  const H=(hi-lo)*PXM;let hours='';for(let m=lo;m<=hi;m+=60)hours+=`<div class="chl" style="top:${(m-lo)*PXM}px"><span>${mtime(m)}</span></div>`;
  let half='';for(let m=lo+slot;m<hi;m+=slot)if(m%60)half+=`<div class="chl2" style="top:${(m-lo)*PXM}px"></div>`;
  const nowM=new Date().getHours()*60+new Date().getMinutes(),showNow=d===todayStr()&&nowM>=lo&&nowM<=hi;
  const colHtml=c=>{const as=all.filter(a=>(a.staffId||'')===(c.id||'')||(!st.length));
    return`<div class="ccol"><div class="chd" style="border-bottom-color:${c.color}"><span class="dot" style="background:${c.color}"></span>${esc(c.name)} <span class="muted small">${as.filter(a=>a.status!=='otk').length}</span></div>
     <div class="cbody w-slot" data-staff="${esc(c.id||'')}" style="height:${H}px">${hours.replace(/<span>[^<]*<\/span>/g,'')}${half}${showNow?`<div class="nowl" style="top:${(nowM-lo)*PXM}px"></div>`:''}
     ${as.map(a=>{const top=(tmin(a.time)-lo)*PXM,h=Math.max(22,(num(a.dur)||30)*PXM-2),x=AST[a.status]||AST.zak;
       return`<div class="appt st-${a.status}" data-act="aedit" data-id="${a.id}" style="top:${top}px;height:${h}px;--c:${(staffById(a.staffId)||{}).color||'var(--acc)'}"><b>${esc(a.time)} ${esc(apptName(a))}</b><span>${esc(apptSvc(a))}</span>${a.status!=='zak'?`<i>${x.i}</i>`:''}</div>`}).join('')}</div></div>`};
  return`<div class="pnav"><button data-act="calday" data-v="${addD(d,-1)}">‹</button><div class="lbl"><input type="date" id="calDate" value="${d}" class="fld" style="padding:6px 8px;width:auto;display:inline-block"> <b>${esc(dLabel(d))}</b></div><button data-act="calday" data-v="${addD(d,1)}">›</button><button data-act="calday" data-v="${todayStr()}">Danas</button></div>
   <div class="wstrip">${Array.from({length:7},(_,i)=>{const x=addD(ws,i),n=dayAppts(x).filter(a=>a.status!=='otk').length,dd=new Date(x+'T12:00:00');return`<button data-act="calday" data-v="${x}" class="${x===d?'on':''} ${x===todayStr()?'td':''}"><small>${DS[dd.getDay()]}</small><b>${dd.getDate()}</b>${n?`<i>${n}</i>`:'<i class="z">·</i>'}</button>`}).join('')}</div>
   <div class="small muted" style="margin:0 2px 8px">${RO?'':'Klikni na prazno mesto u kalendaru da zakažeš termin u to vreme. '}${all.filter(a=>a.status!=='otk').length} termina · ${all.filter(a=>a.status==='dosao').length} završeno</div>
   <div class="cal"><div class="ctime"><div class="chd"></div><div style="position:relative;height:${H}px">${hours}</div></div><div class="ccols">${cols.map(colHtml).join('')}</div></div>`}
function calAfter(){const di=$('calDate');if(di)di.onchange=()=>{if(di.value){ui.day=di.value;render()}};

function repRange(){const M=ui.rp;if(M==='m'){const s=ui.rmon+'-01',[y,m]=ui.rmon.split('-').map(Number);return{a:s,b:ymd(new Date(y,m,0)),lbl:MSL[m-1]+' '+y}}
  if(M==='y')return{a:ui.ry+'-01-01',b:ui.ry+'-12-31',lbl:'Godina '+ui.ry};const n=+M,b=todayStr(),d=new Date();d.setMonth(d.getMonth()-n);return{a:ymd(d),b,lbl:'Poslednjih '+n+' meseci'}}
function repData(){const R=repRange(),inv=db.invoices.filter(o=>o.date>=R.a&&o.date<=R.b),ap=db.appts.filter(a=>a.date>=R.a&&a.date<=R.b);
  const tot={total:0,paid:0,svc:0,hours:0,prod:0},byStaff={},bySvc={},byPay={},byM={};
  inv.forEach(o=>{const t=calc(o);tot.total+=t.total;if(o.paid)tot.paid+=t.total;tot.svc+=t.svc;tot.hours+=t.hours;tot.prod+=t.prod;
    const k=o.staffId||'-';(byStaff[k]=byStaff[k]||{n:0,t:0}).n++;byStaff[k].t+=t.total;const p=o.pay||'Gotovina';(byPay[p]=byPay[p]||{n:0,t:0}).n++;byPay[p].t+=t.total;
    const mk=o.date.slice(0,7);(byM[mk]=byM[mk]||{n:0,t:0}).n++;byM[mk].t+=t.total;
    const f=t.sub?t.total/t.sub:1;(o.items||[]).forEach(i=>{const n=i.name||'—';(bySvc[n]=bySvc[n]||{n:0,t:0}).n+=num(i.qty)||1;bySvc[n].t+=num(i.qty)*num(i.price)*f})});
  const st={};Object.keys(AST).forEach(k=>st[k]=ap.filter(a=>a.status===k).length);
  return Object.assign(R,{inv,ap,tot,byStaff,bySvc,byPay,byM,st,newC:db.clients.filter(c=>(c.created||'')>=R.a&&(c.created||'')<=R.b).length})}

/* ---------- GENERIČKA FORMA ---------- */
let gf=null;
function openForm(cfg){
  gf=cfg;const vals=cfg.values||{};
  const fld=x=>{let val=vals[x.k]!==undefined?vals[x.k]:(x.d!==undefined?x.d:'');if(val==null)val='';let el;
    if(x.t==='select')el=`<select class="fld" name="${x.k}">${x.o().map(([v,l])=>`<option value="${esc(v)}" ${String(v)===String(val)?'selected':''}>${esc(l)}</option>`).join('')}</select>`;
    else if(x.t==='textarea')el=`<textarea class="fld" name="${x.k}" rows="${x.rows||2}">${esc(val)}</textarea>`;
    else if(x.t==='check')return`<label class="row" style="margin:8px 0;grid-column:1/-1"><input type="checkbox" name="${x.k}" ${val?'checked':''} style="width:20px;height:20px"> ${x.l}</label>`;
    else el=`<input class="fld" name="${x.k}" type="${x.t||'text'}" ${x.t==='number'?'inputmode="decimal" step="any"':''} ${x.list?`list="${x.list}"`:''} value="${esc(val)}" placeholder="${esc(x.ph||'')}" ${x.req?'required':''} ${x.upper?'style="text-transform:uppercase"':''} autocomplete="off">`;
    return`<div style="${x.h?'':'grid-column:1/-1'}"><label class="l">${x.l}${x.req?' *':''}</label>${el}${x.hint?`<div class="small muted" id="${x.hint}" style="margin-top:3px"></div>`:''}</div>`};
  $('dlgBody').innerHTML=`<form id="gf"><h3>${cfg.title}</h3>${cfg.pre||''}<div class="grid g2" style="gap:10px">${cfg.fields.map(fld).join('')}</div><div class="row" style="margin-top:14px"><button type="button" class="grow" data-act="dlgclose">Otkaži</button><button class="btn-p grow">💾 Sačuvaj</button></div></form>`;
  if(!$('dlg').open)$('dlg').showModal();
}
document.addEventListener('submit',e=>{
  if(e.target.id!=='gf')return;e.preventDefault();
  const f=e.target,fd=new FormData(f),o={};
  gf.fields.forEach(x=>{if(x.t==='check')o[x.k]=f.elements[x.k].checked;else{const v=fd.get(x.k);o[x.k]=x.t==='number'?(v===''?'':num(v)):String(v||'').trim()}});
  if(gf.onSave(o)!==false){$('dlg').close();render()}
});

/* ---------- NBS IPS QR (predračun i račun) ---------- */
/* tekući račun u 18 cifara (banka 3 + broj 13 + kontrolni 2), sa proverom kontrolnog broja (mod 97) */
function ipsAcc(a){
  const t=String(a||'').replace(/[^\d-]/g,'');if(!t)return'';
  let r;if(t.includes('-')){const p=t.split('-').filter(Boolean);if(p.length!==3||p[0].length>3||p[1].length>13||p[2].length>2)return'';r=p[0].padStart(3,'0')+p[1].padStart(13,'0')+p[2].padStart(2,'0')}else r=t;
  if(!/^\d{18}$/.test(r))return'';
  try{return BigInt(r)%97n===1n?r:''}catch{return r}
}
const ipsClean=(s,n)=>String(s||'').replace(/[|\r\n]+/g,' ').replace(/\s+/g,' ').trim().slice(0,n);
function ipsText(o,kind){
  const sh=S().shop,acc=ipsAcc(sh.acc),t=calc(o).total;
  if(!acc||!(t>0)||!ipsClean(sh.name,70))return'';
  const no=o.no;
  const nm=ipsClean(sh.name,40),place=ipsClean([sh.addr,sh.city].filter(Boolean).join(', '),66-nm.length);
  const ro=String(no||'').replace(/[^\d-]/g,'').replace(/^-+|-+$/g,'').replace(/-{2,}/g,'-');
  const f=['K:PR','V:01','C:1','R:'+acc,'N:'+nm+(place?'\r\n'+place:''),'I:RSD'+(Math.round(t*100)/100).toFixed(2).replace('.',','),'SF:'+(/^[12]\d\d$/.test(String(S().ipsSf))?S().ipsSf:'289'),
    'S:'+ipsClean((kind==='racun'?'Račun ':'Predračun ')+(no||''),35)];
  if(ro)f.push('RO:00'+ro.slice(0,23));
  return f.join('|');
}
function ipsBlock(o,kind){
  if(S().ipsQr===false||!window.AtmosQR||(kind==='racun'&&o.paid))return'';
  const txt=ipsText(o,kind);if(!txt)return'';
  try{return`<div class="ipsqr">${AtmosQR.svg(txt,118)}<div><b>NBS IPS QR</b><br>Plati skeniranjem u aplikaciji m-banking (opcija „IPS skeniraj“). Iznos i podaci se popunjavaju sami.</div></div>`}catch{return''}
}


function pdfFromJpegs(pages){
  const enc=new TextEncoder(),parts=[],xref=[];let off=0;
  const push=b=>{const u=typeof b==='string'?enc.encode(b):b;parts.push(u);off+=u.length};
  const n=pages.length,PW=595.28,PH=841.89;
  push('%PDF-1.4\n');
  xref[1]=off;push('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
  xref[2]=off;push('2 0 obj\n<< /Type /Pages /Kids ['+pages.map((_,i)=>(3+i*3)+' 0 R').join(' ')+'] /Count '+n+' >>\nendobj\n');
  pages.forEach((pg,i)=>{
    const P=3+i*3,C=P+1,I=P+2,content=`q ${PW} 0 0 ${PH} 0 0 cm /Im0 Do Q`;
    xref[P]=off;push(`${P} 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /XObject << /Im0 ${I} 0 R >> >> /Contents ${C} 0 R >>\nendobj\n`);
    xref[C]=off;push(`${C} 0 obj\n<< /Length ${content.length} >>\nstream\n${content}\nendstream\nendobj\n`);
    xref[I]=off;push(`${I} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${pg.w} /Height ${pg.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${pg.bytes.length} >>\nstream\n`);push(pg.bytes);push('\nendstream\nendobj\n');
  });
  const total=3+n*3,xo=off;
  push('xref\n0 '+total+'\n0000000000 65535 f \n'+xref.slice(1).map(o=>String(o).padStart(10,'0')+' 00000 n \n').join(''));
  push('trailer\n<< /Size '+total+' /Root 1 0 R >>\nstartxref\n'+xo+'\n%%EOF');
  const out=new Uint8Array(off);let p=0;parts.forEach(u=>{out.set(u,p);p+=u.length});return out;
}
async function renderDocPages(){
  const W=703,MM=12,PWpx=794,PHpx=1123,MG=Math.round(MM/25.4*96),PAGE=PHpx-2*MG,SC=2;
  let css='';for(const sh of document.styleSheets){try{for(const r of sh.cssRules){if(r.type===1&&/\.doc\b|\.plate/.test(r.selectorText||''))css+=r.cssText}}catch{}}
  css+='.small{font-size:.8rem}.muted{color:#666}.doc{padding:0!important;margin:0!important;box-shadow:none!important;max-width:none!important;width:'+W+'px!important;box-sizing:border-box}';
  const inner='<style>'+css+'</style><div class="doc">'+$('docBody').innerHTML+'</div>';
  /* merenje u izolovanom iframe-u (isti kontekst kao pri crtanju u slici) */
  const host=document.createElement('iframe');host.style.cssText='position:fixed;left:-10000px;top:0;width:'+W+'px;height:4000px;border:0';
  host.srcdoc='<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#fff}</style></head><body>'+inner+'</body></html>';
  document.body.appendChild(host);await new Promise(r=>{host.onload=r});
  try{
    const doc=host.contentDocument,d=doc.querySelector('.doc');await new Promise(r=>setTimeout(r,80));
    const imgs=[...d.querySelectorAll('img')];await Promise.all(imgs.map(i=>i.complete?1:new Promise(r=>{i.onload=i.onerror=r})));
    const H=Math.ceil(d.getBoundingClientRect().height),top0=d.getBoundingClientRect().top,tops=[];
    [...d.children].forEach(c=>{if(!(c.previousElementSibling&&c.previousElementSibling.tagName==='H2'))tops.push(Math.round(c.getBoundingClientRect().top-top0))});
    d.querySelectorAll('.items').forEach(t=>{[...t.querySelectorAll('tr')].forEach((tr,i)=>{if(i>1)tops.push(Math.round(tr.getBoundingClientRect().top-top0))})});
    tops.sort((a,b)=>a-b);
    const br=[];let st=0;while(H-st>PAGE){const lim=st+PAGE;let b=-1;for(const t of tops)if(t>st+60&&t<=lim)b=t;if(b<0)b=lim;br.push([st,b]);st=b}br.push([st,H]);
    const wrap=document.createElement('div');wrap.style.cssText='width:'+W+'px;background:#fff';wrap.innerHTML=inner;
    const ser=new XMLSerializer().serializeToString(wrap);
    const svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+W+'" height="'+H+'"><foreignObject x="0" y="0" width="100%" height="100%">'+ser+'</foreignObject></svg>';
    const img=new Image();await new Promise((res,rej)=>{img.onload=res;img.onerror=()=>rej(new Error('svg'));img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)});
    const full=document.createElement('canvas');full.width=W*SC;full.height=H*SC;const fc=full.getContext('2d');fc.fillStyle='#fff';fc.fillRect(0,0,full.width,full.height);fc.drawImage(img,0,0,W*SC,H*SC);
    const out=[];
    for(const [a,b] of br){
      const cv=document.createElement('canvas');cv.width=PWpx*SC;cv.height=PHpx*SC;const c=cv.getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,cv.width,cv.height);
      c.drawImage(full,0,a*SC,W*SC,(b-a)*SC,MG*SC,MG*SC,W*SC,(b-a)*SC);
      const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',.92));
      out.push({bytes:new Uint8Array(await blob.arrayBuffer()),w:cv.width,h:cv.height});
    }
    return out;
  }finally{host.remove()}
}
async function docPdf(){
  const name=(docCtx.name||'dokument').replace(/[^\w\-]+/g,'_')+'.pdf';
  try{
    if(!docCtx.pdf){toast('Pravim PDF…');docCtx.pdf=new File([pdfFromJpegs(await renderDocPages())],name,{type:'application/pdf'})}
    const f=docCtx.pdf;
    if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:name});return}catch(e){if(e&&e.name==='AbortError')return;toast('Pritisni „Podeli PDF“ još jednom');return}}
    const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);toast('PDF preuzet ✔');
  }catch(e){docCtx.pdf=null;toast('PDF nije uspeo — koristi „Štampaj“ i sačuvaj kao PDF')}
}


/* ---------- IndexedDB: interne kopije + folder ---------- */
const idbOpen=()=>new Promise((res,rej)=>{const r=indexedDB.open('atmosStudioDB',1);r.onupgradeneeded=()=>r.result.createObjectStore('h');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function idbGet(k){const d=await idbOpen();return new Promise((res,rej)=>{const q=d.transaction('h').objectStore('h').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function idbSet(k,v){const d=await idbOpen();return new Promise((res,rej)=>{const t=d.transaction('h','readwrite');t.objectStore('h').put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
async function idbDel(k){const d=await idbOpen();return new Promise((res,rej)=>{const t=d.transaction('h','readwrite');t.objectStore('h').delete(k);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
let snaps=[];
async function loadSnaps(){try{snaps=(await idbGet('snaps'))||[]}catch{snaps=[]}}
async function takeSnap(reason,force){
  try{if(!hasData())return;const data=JSON.stringify(db);await loadSnaps();const day=todayStr();if(!force&&snaps.length&&snaps[0].day===day)return;
    snaps.unshift({t:new Date().toISOString(),day,reason:reason||'automatski',data});const keep=Math.max(1,Math.min(30,num(S().snapKeep)||7));while(snaps.length>keep)snaps.pop();await idbSet('snaps',snaps)}catch{}
}
async function restoreSnap(i){if(RO){roBlock();return}const s=snaps[i];if(!s)return;
  if(!confirm('Vratiti podatke iz kopije od '+new Date(s.t).toLocaleString('sr-RS')+'? Trenutno stanje se prvo sačuva.'))return;
  const data=s.data;await takeSnap('pre-vraćanja',true);db=norm2(JSON.parse(data));persist();render();toast('Podaci vraćeni ✔')}


async function shareText(title,text){
  try{if(navigator.share){await navigator.share({title,text});return}}catch(e){if(e&&e.name==='AbortError')return}
  try{await navigator.clipboard.writeText(text);toast('Tekst kopiran')}catch{download('poruka.txt',text,'text/plain')}}

/* ---------- PWA + AUTOMATSKO AŽURIRANJE ---------- */
let swReg=null;
function showUpd(){$('updBar').hidden=false}
function applyUpdate(){if(swReg&&swReg.waiting)swReg.waiting.postMessage({type:'SKIP_WAITING'});else location.reload()}
async function checkUpdate(manual){
  if(!swReg){if(manual)toast('Ažuriranje radi samo kad je aplikacija otvorena sa https adrese');return}
  try{await swReg.update();if(swReg.waiting)showUpd();else if(manual)setTimeout(()=>{if(swReg.waiting||swReg.installing)toast('Nova verzija se preuzima…');else toast('Imaš najnoviju verziju ('+VER+') ✔')},1500)}catch{if(manual)toast('Provera nije uspela — nema veze sa serverom')}
}
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){
  const hadCtl=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(reg=>{
    swReg=reg;
    const track=w=>w&&w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)showUpd()});
    if(reg.waiting&&navigator.serviceWorker.controller)showUpd();
    reg.addEventListener('updatefound',()=>track(reg.installing));
    reg.update().catch(()=>{});
    setInterval(()=>reg.update().catch(()=>{}),30*60*1000);
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)reg.update().catch(()=>{})});
  }).catch(()=>{});
  let reloading=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!hadCtl||reloading)return;reloading=true;location.reload()});
}

/* URL web aplikacije iz Apps Script-a (Deploy → Manage deployments → Web app URL, završava se na /exec) */
const AUTH_URL=''; /* ← upiši Web app URL iz Studio Code.gs (Deploy → Manage deployments), završava se na /exec */
const AUTH_KEY='atmosStudioAuth1';
const OFFLINE_DAYS=7;            /* koliko dana sme da radi bez internet provere; posle toga se traži prijava uz internet */
const RECHECK_MIN=30;            /* na koliko minuta se ponovo proverava PIN */

let authUser='',authDays=null,authExp='';
/* preostali dani: broj sa servera umanjen za dane od poslednje provere */
const daysLeft=s=>s.days==null?null:s.days-Math.floor((Date.now()-s.t)/864e5);
/* sme li da uđe bez servera: najviše OFFLINE_DAYS od poslednje uspešne provere */
const freshAuth=s=>Date.now()-s.t<OFFLINE_DAYS*864e5;
/* stanje na osnovu sačuvane prijave: istekla licenca = samo pregled */
const stateOf=s=>(s.expired||(daysLeft(s)!=null&&daysLeft(s)<=0))?'expired':'ok';
function roBlock(){toast(authState==='expired'?'🔒 Licenca je istekla — samo pregled. Klikni „Aktivacija“.':'🔒 Režim samo za pregled')}
function loadAuth(){try{const s=JSON.parse(localStorage.getItem(AUTH_KEY));return s&&s.u&&s.p?s:null}catch{return null}}
let authDev=null; /* {n: prijavljeno uređaja, max: najviše} — šalje server (Code.gs uredjaji-2) */
function storeAuth(u,p,days,exp,expired){try{localStorage.setItem(AUTH_KEY,JSON.stringify({u,p,days:days==null?null:Number(days),exp:exp||'',expired:!!expired,t:Date.now(),dev:authDev}))}catch{}}
function clearAuth(){try{localStorage.removeItem(AUTH_KEY)}catch{}}

/* ID ovog uređaja (nasumičan, pravi se jednom) — server dozvoljava ograničen broj uređaja po nalogu */
const DEV_KEY='atmosStudioDev1';
function deviceId(){
  try{let d=localStorage.getItem(DEV_KEY);if(d&&/^[a-z0-9]{12}$/.test(d))return d;
    const a=new Uint8Array(12);crypto.getRandomValues(a);d=Array.from(a,x=>'abcdefghijklmnopqrstuvwxyz0123456789'[x%36]).join('');
    localStorage.setItem(DEV_KEY,d);return d}catch{return ''}
}
function deviceName(){const ua=navigator.userAgent||'';return /AtmosStudioApp/.test(ua)?'Windows':/Android/i.test(ua)?'Android':/iPhone|iPad/i.test(ua)?'iPhone':'Pregledač'}
const lockedMsg=r=>'Previše pogrešnih pokušaja. Nalog je privremeno zaključan — pokušaj ponovo za '+(r.minutes||15)+' minuta.';
const limitMsg=r=>'Nalog je već aktiviran na '+(r.max||3)+' uređaja. Za novi uređaj javi se podršci (taster Aktivacija).';
const blockedMsg='Ovaj uređaj je isključen sa naloga. Javi se podršci (taster Aktivacija).';
async function serverCheck(u,p){
  if(!AUTH_URL)throw new Error('no-url');
  const r=await fetch(AUTH_URL+'?user='+encodeURIComponent(u)+'&pin='+encodeURIComponent(p)+'&device='+encodeURIComponent(deviceId())+'&dname='+encodeURIComponent(deviceName()),{cache:'no-store'});
  if(!r.ok)throw new Error('http '+r.status);
  const j=await r.json();
  if(j&&j.maxDevices!=null)authDev={n:Number(j.devices)||0,max:Number(j.maxDevices)};
  if(j&&(j.status==='ok'||j.status==='expired'))setAdmin(!!j.admin);
  return j;
}

$('authDlg').addEventListener('cancel',e=>{if(authState==='locked')e.preventDefault()});
async function doLogin(){
  const u=$('auU').value.trim(),p=$('auP').value.trim(),msg=m=>{$('auMsg').textContent=m},go=$('auGo');
  if(!u||!p){msg('Unesi korisničko ime i PIN.');return}
  go.disabled=true;msg('Provera…');
  try{
    const r=await serverCheck(u,p);
    if(r.status==='ok'){storeAuth(u,p,r.days,r.expires);$('authDlg').close();setAuth('ok',u,r.days,r.expires);toast(r.days!=null&&r.days<=7?'Prijava uspešna — licenca ističe za '+r.days+' '+plDan(r.days):'Prijava uspešna ✔')}

/* provera sačuvanih podataka pri pokretanju i povremeno u toku rada */
async function authRecheck(){

    const r=await serverCheck(s.u,s.p);
    if(r.status==='ok'||r.status==='expired'){if(ui.tab==='podesavanja')setTimeout(bgRender,0)}

    else if(r.status==='expired'){storeAuth(s.u,s.p,0,r.expires,true);if(authState!=='expired')setAuth('expired',s.u,0,r.expires)}
    else if(r.status==='limit'){clearAuth();lock(limitMsg(r))}
    else if(r.status==='locked'){/* neko pogađa PIN ovog naloga — ovaj uređaj ostaje prijavljen */}
    else if(r.status==='blocked'){clearAuth();lock(blockedMsg)}
    else{clearAuth();lock('PIN više nije važeći. Prijavi se ponovo.')}
  }catch{
    /* nema mreže: važi poslednja uspešna provera do OFFLINE_DAYS */
    if(!freshAuth(s)&&authState!=='locked'){lock('Predugo bez provere sa serverom (najviše '+OFFLINE_DAYS+' dana) — poveži se na internet i prijavi se.')}
    else if(authState==='ok'){const d=daysLeft(s);if(d!=null&&d<=0)setAuth('expired',s.u,0,s.exp);else if(d!==authDays){authDays=d;updAuthUI()}}
  }
}

function gdSoon(ms){if(!gd.on)return;clearTimeout(gdT);gdT=setTimeout(()=>{if(gdValid())gdSync()},ms==null?5000:ms)}
async function gdSync(manual){
  if(!gd.on||gdBusy||authState==='locked')return;
  if(!navigator.onLine){gd.err='Nema interneta — izmene čekaju';gdStore();if(manual)toast(gd.err);return}
  if(document.querySelector('dialog[open]')&&!manual){gdSoon(20000);return}
  gdBusy=true;if(manual&&ui.tab==='podesavanja')bgRender();let got=0,sent=0,retry=false;
  try{
    if(!gdValid()){if(!manual){gd.err='Potrebna je potvrda — dodirni „Sinhronizuj“';return}await gdAuth(false)}
    const ver=async()=>gd.fileId?Number((await (await gdApi('https://www.googleapis.com/drive/v3/files/'+gd.fileId+'?fields=version')).json()).version)||0:0;
    let remote={recs:{}},v0=0;
    if(await gdFindFile()){v0=await ver();try{remote=await (await gdApi('https://www.googleapis.com/drive/v3/files/'+gd.fileId+'?alt=media')).json()}catch(e){if(e.message==='auth')throw e;remote={recs:{}}}}
    const R=remote.recs||{},loc=gdLocal(),now=Date.now(),out=Object.assign({},R),first=!gd.last;
    /* lokalne izmene (u režimu samo za pregled ništa se ne šalje) */
    const mine={};if(authState==='ok'){Object.keys(loc).forEach(k=>{const h=gdHash(loc[k]);if(gd.h[k]!==h||!(k in R))mine[k]=loc[k]});Object.keys(gd.h).forEach(k=>{if(!(k in loc))mine[k]=null})}
    /* podešavanja: uređaj koji se prvi put povezuje preuzima sa Drive-a; inače novija izmena pobeđuje */
    if(mine._set&&R._set&&R._set.d){const rh=gdHash(R._set.d);if(rh!==gd.h._set&&(first||gd.h._set===undefined||(R._set.t||0)>(gd.mt._set||0)))delete mine._set}
    Object.keys(R).forEach(k=>{const rv=R[k]&&R[k].d!==undefined?R[k].d:null,rh=rv?gdHash(rv):null;if(k in mine)return;if(rh===(gd.h[k]||null))return;
      if(k==='_set'){if(rv){const keep={};LOCAL_SET.forEach(x=>{if(x in S())keep[x]=S()[x]});const ns=Object.assign(DEF_SET(),rv,keep);ns.shop=Object.assign(DEF_SET().shop,rv.shop||{});db.settings=ns;gd.h[k]=gdHash(gdShared());got++}return}
      if(k==='_cnt')return;
      const[c,id]=k.split('/');if(!COLLS.includes(c))return;const i=db[c].findIndex(x=>x.id===id);
      if(rv){if(i>=0)db[c][i]=rv;else db[c].push(rv);gd.h[k]=rh}else{if(i>=0)db[c].splice(i,1);delete gd.h[k]}got++});
    /* brojevi računa: uzima se veći */
    const rc=(R._cnt&&R._cnt.d)||{};let cch=false;Object.keys(rc).forEach(k=>{if((Number(rc[k])||0)>(db.counters[k]||0)){db.counters[k]=Number(rc[k]);got++}});Object.keys(db.counters).forEach(k=>{if((db.counters[k]||0)>(Number(rc[k])||0))cch=true});
    Object.keys(mine).forEach(k=>{out[k]={t:now,d:mine[k]};sent++;if(mine[k])gd.h[k]=gdHash(mine[k]);else delete gd.h[k]});
    if(cch&&authState==='ok'){out._cnt={t:now,d:Object.assign({},rc,db.counters)};sent++}
    if(gd.fileId&&sent&&(await ver())!==v0){if((gdSync.retry=(gdSync.retry||0)+1)<=3){retry=true;gdBusy=false;setTimeout(()=>gdSync(manual),400+Math.random()*800);return}}
    gdSync.retry=0;
    if(sent||!gd.fileId)await gdUpload({app:'Atmos Studio',v:1,t:new Date().toISOString(),recs:out});
    if(got){try{localStorage.setItem(KEY,JSON.stringify(db))}catch{}}
    gd.last=Date.now();gd.err='';gd.mt={};
    if(manual)toast(got?'Sinhronizovano ✔ — stiglo izmena: '+got:'Sinhronizovano ✔');
    if(got&&!document.querySelector('dialog[open]')&&$('docView').hidden)bgRender();
  }catch(e){gd.err=e.message==='auth'?'Potrebna je potvrda — dodirni „Sinhronizuj“':String(e.message||'Greška');if(manual)toast('⚠ '+gd.err)}
  finally{if(!retry){gdBusy=false;gdStore();if(ui.tab==='podesavanja'&&!document.querySelector('dialog[open]'))bgRender()}}}
function gdWatch(){if(!gd.on)return;const h=gdHash(gdShared());if(gd.h._set!==undefined&&h!==gd.h._set&&!gd.mt._set){gd.mt._set=Date.now();gdStore()}}
async function gdConnect(){try{await gdAuth(true);try{const u=await (await gdApi('https://www.googleapis.com/drive/v3/about?fields=user(emailAddress)')).json();gd.email=(u.user&&u.user.emailAddress)||''}catch{}
  gd.on=true;gd.h={};gd.mt={};gd.fileId='';gd.last=0;gdStore();toast('Google Drive povezan ✔');await gdSync(true)}catch(e){toast('⚠ '+(e.message||'Povezivanje nije uspelo'))}render()}
function gdDisconnect(){if(!confirm('Prekinuti sinhronizaciju sa Google Drive-om? Podaci ostaju i na uređaju i na Drive-u.'))return;try{if(gdTok&&window.google&&google.accounts)google.accounts.oauth2.revoke(gdTok.t,()=>{})}catch{}
  gdTok=null;try{sessionStorage.removeItem(GD_KEY+'_t')}catch{}gd={on:false,fileId:'',h:{},mt:{},last:0,err:'',email:''};gdStore();render();toast('Veza sa Google Drive-om je prekinuta')}
function gdCard(){
  if(!gd.on)return`<div class="card"><h3>☁️ Google Drive</h3><div class="small muted" style="margin-bottom:10px">Čuvaj podatke salona na <b>svom</b> Google Drive-u i koristi ih na više uređaja (telefon, tablet, računar). Aplikacija vidi samo svoj fajl „${esc(GD_NAME)}“ — ništa drugo sa tvog Drive-a, a podaci ne idu nikome drugom.</div>
    <button class="btn-p" data-act="gdconnect" style="width:100%">☁️ Poveži Google Drive</button></div>`;
  const t=gd.last?new Date(gd.last).toLocaleString('sr-RS',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'nikad';
  return`<div class="card"><h3>☁️ Google Drive <span class="badge b-ok">povezano</span></h3>
    <div class="small muted">${gd.email?esc(gd.email)+'<br>':''}Poslednja sinhronizacija: <b>${esc(t)}</b>. Izmene se šalju par sekundi posle čuvanja i na svakih 5 minuta.</div>
    ${gd.err?`<div class="alert warn" style="margin:8px 0 0">${esc(gd.err)}</div>`:''}
    <div class="grid g2" style="margin-top:10px"><button class="btn-p" data-act="gdsync" ${gdBusy?'disabled':''}>${gdBusy?'⏳':'🔄'} Sinhronizuj</button><button data-act="gddis">Prekini vezu</button></div></div>`}
function gdStart(){setInterval(()=>{if(gd.on&&gdValid())gdSync()},5*60000);setInterval(gdWatch,5000);addEventListener('online',()=>gdSoon(1500));
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&gd.on&&Date.now()-gd.last>60000)gdSoon(1500)});if(gd.on&&gdValid())gdSoon(2500)}

/* ---------- IZVOZ / UVOZ ---------- */
async function exportFile(){const name=`atmos-studio-backup-${todayStr()}.json`,text=JSON.stringify(db);
  const done=m=>{if(!RO){S().lastExport=todayStr();persist()}render();toast(m)};
  if(window.isSecureContext&&navigator.share&&/Android|iPhone|iPad/i.test(navigator.userAgent)){const file=new File([text],name,{type:'application/json'});
    try{if(!navigator.canShare||navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});done('Kopija podeljena ✔');return}}catch(e){if(e&&e.name==='AbortError')return}}
  download(name,text,'application/json');done('Kopija preuzeta kao fajl ✔')}
$('impFile').onchange=e=>{if(RO){roBlock();e.target.value='';return}const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=async ev=>{try{const p=JSON.parse(ev.target.result);if(!p||!Array.isArray(p.clients)||!Array.isArray(p.appts))throw 0;await takeSnap('pre-uvoza',true);
    if(confirm('Spojiti uvezene podatke sa postojećim?\n\nOK = spoji (dodaje nove, ažurira iste)\nOtkaži = ponuda za zamenu svega')){
      const add=(a,b)=>(b||[]).forEach(x=>{const i=a.findIndex(y=>y.id===x.id);if(i<0)a.push(x);else a[i]=x});COLLS.forEach(k=>add(db[k],p[k]));
      Object.entries(p.counters||{}).forEach(([k,v])=>{db.counters[k]=Math.max(db.counters[k]||0,v)})}
    else if(confirm('Zameniti SVE trenutne podatke uvezenim?'))db=norm2(p);else{e.target.value='';return}
    save();go('pregled');toast('Podaci uvezeni ✔')}catch{toast('Nepoznat format fajla')}e.target.value=''};r.readAsText(f)};

/* ---------- AKCIJE ---------- */
const W_ACTS=new Set(['newappt','newinv','newcli','editcli','newsvc','editsvc','delsvc','presets','preset','newstaff','editstaff','delstaff','adone','ainv','invpaid','invsave','invsaveprint','invdel','apsave','apdel','apst','import','reset','logopick','logodel','msgreset','snaprest']);
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act],[data-tab],[data-set]');if(!b)return;const d=b.dataset;
  if(b.closest('#pickDlg'))return;
  if(d.set&&!d.act){if(RO&&!['theme','accent','fs'].includes(d.set)){roBlock();return}S()[d.set]=d.val;save();render();return}
  if(d.tab&&!d.act){if($('dlg').open)$('dlg').close();go(d.tab);return}
  const a=d.act,id=d.id;
  if(RO&&W_ACTS.has(a)){roBlock();return}
  if(a&&a.startsWith('adm')){await admAct(a,d);return}
  switch(a){
    case'dlgclose':$('dlg').close();return;
    case'calday':ui.day=d.v;if(ui.tab!=='kalendar')ui.tab='kalendar';render();return;
    case'goinv':ui.inv=d.v;go('racuni');return;
    case'rp':ui.rp=d.v;render();return;
    case'rmon':{const[y,m]=ui.rmon.split('-').map(Number),x=new Date(y,m-1+(+d.v),1);ui.rmon=x.getFullYear()+'-'+pad(x.getMonth()+1);render();return}
    case'ry':ui.ry=String(+ui.ry+(+d.v));render();return;
    /* klijenti */
    case'newcli':cliForm(null,null,c=>openCli(c.id));return;
    case'editcli':$('dlg').close();cliForm(id);return;
    case'opencli':openCli(id);return;
    case'climsg':{const c=cliById(id);if(!c)return;const sh=S().shop;const t=d.k==='bday'?`Srećan rođendan, ${firstName(c.name)}! 🎉 Želimo Vam sve najlepše. ${sh.name||''}`:`Poštovani ${firstName(c.name)}, `;msgDlg('💬 Poruka · '+esc(c.name),c.phone,t);return}
    /* usluge / zaposleni */
    case'newsvc':svcForm();return;case'editsvc':svcForm(id);return;
    case'delsvc':if(confirm('Obrisati uslugu? Postojeći termini i računi ostaju.')){db.services=db.services.filter(x=>x.id!==id);save();$('dlg').close();render()}return;
    case'presets':presetDlg();return;
    case'preset':{const have=new Set(db.services.map(s=>nName(s.name)));let n=0;PRESETS[d.v].forEach(([nm,cat,dur])=>{if(!have.has(nName(nm))){db.services.push({id:uid(),name:nm,cat,dur,price:'',unit:'usl'});n++}});save();$('dlg').close();render();toast('Dodato usluga: '+n+' — upiši cene');return}
    case'newstaff':staffForm();return;case'editstaff':staffForm(id);return;
    case'delstaff':if(confirm('Obrisati zaposlenog? Termini ostaju, bez dodele.')){db.staff=db.staff.filter(x=>x.id!==id);db.appts.forEach(x=>{if(x.staffId===id)x.staffId=''});save();$('dlg').close();render()}return;
    /* termini */
    case'newappt':openAppt(null,{cid:d.c||'',date:ui.tab==='kalendar'?ui.day:todayStr(),time:(()=>{const n=new Date(),m=Math.ceil((n.getHours()*60+n.getMinutes()+15)/30)*30;return ui.tab==='kalendar'&&ui.day!==todayStr()?S().dayStart||'09:00':mtime(Math.max(tmin(S().dayStart||'08:00'),Math.min(m,tmin(S().dayEnd||'20:00')-30)))})()});return;
    case'aedit':openAppt(id);return;
    case'apsvc':{apRead();const s=new Set(ae.a.svcs||[]);if(s.has(id))s.delete(id);else s.add(id);ae.a.svcs=[...s];ae.a.dur=Math.max(15,ae.a.svcs.reduce((t,x)=>t+(num((svcById(x)||{}).dur)||0),0)||num(ae.a.dur));const st=$('dlg').scrollTop;apDraw();$('dlg').scrollTop=st;return}
    case'apst':apRead();ae.a.status=d.v;apDraw();return;
    case'apnewcli':{apRead();const nm=($('aCli').value||'').trim()||(prompt('Ime i prezime klijenta:')||'').trim();if(!nm)return;const ph=(prompt('Telefon klijenta (za podsetnike):')||'').trim();let c=db.clients.find(x=>nName(x.name)===nName(nm));if(!c){c={id:uid(),name:nm,phone:ph,created:todayStr()};db.clients.push(c)}else if(ph)c.phone=ph;ae.a.cid=c.id;save();render();apDraw();return}
    case'apsave':if(apSave()){$('dlg').close();render();toast(ae.rep?'Zakazano termina: '+ae.repN+' ✔':'Sačuvano ✔')}return;
    case'apdel':{const x=ae.a,ser=x.ser&&db.appts.filter(y=>y.ser===x.ser&&y.date>x.date&&y.status==='zak');let all=false;
      if(ser&&ser.length)all=confirm(`Termin se ponavlja. Obrisati i sledećih ${ser.length} termina iz serije?\n\nOK = sve sledeće · Otkaži = samo ovaj`);else if(!confirm('Obrisati termin?'))return;
      db.appts=db.appts.filter(y=>y.id!==x.id&&!(all&&ser.some(z=>z.id===y.id)));save();$('dlg').close();render();toast('Termin obrisan');return}
    case'adone':{const x=apptById(id);x.status='dosao';save();render();if(!x.invId&&confirm('Termin je završen. Izdati račun?'))invFromAppt(x);return}
    case'ainv':{if($('dlg').open&&ae&&ae.a.id===id&&!apSave())return;invFromAppt(apptById(id));return}
    case'arem':{const x=apptById(id);if(!x)return;const c=cliById(x.cid)||{};msgDlg('🔔 Podsetnik · '+esc(apptName(x)),c.phone,remMsg(x),()=>{if(!RO){x.remSent=todayStr();save();bgRender()}});return}
    case'bulkrem':bulkRem(d.v);return;

    case'newinv':openInv(null,d.c?{cid:d.c}:null);return;
    case'invedit':openInv(id);return;

    case'invsaveprint':{const o=invSave();if(o){$('dlg').close();render();showInv(o.id)}return}

    /* izveštaji */

    case'logodel':S().logo='';save();render();return;
    case'msgreset':S().msgRem=DEF_REM;S().msgInv=DEF_INV;save();render();toast('Vraćen podrazumevani tekst');return;
    case'export':exportFile();return;
    case'import':$('impFile').click();return;
    case'snaprest':restoreSnap(+d.i);return;
    case'reset':if(confirm('Obrisati SVE podatke sa ovog uređaja? Prvo napravi rezervnu kopiju!')&&confirm('Sigurno? Ovo ne može da se vrati (osim iz Google Drive-a ili kopije).')){await takeSnap('pre-brisanja',true);const st=S();db=fresh();db.settings=st;save();go('pregled');toast('Podaci obrisani')}return;
    case'checkupd':checkUpdate(true);return;
    case'updnow':applyUpdate();return;
    case'gdconnect':gdConnect();return;case'gdsync':gdSync(true);return;case'gddis':gdDisconnect();return;
  }
});

function authStart(){
  $('authBtn').onclick=()=>{if(confirm('Odjaviti se? Za ponovni ulaz biće potrebni korisničko ime i PIN.')){clearAuth();lock()}};
  const s=loadAuth();if(s&&s.dev)authDev=s.dev;
  if(s&&freshAuth(s)){setAuth(stateOf(s),s.u,daysLeft(s),s.exp);authRecheck()}
  else lock(s?'Prijava je istekla — poveži se na internet i prijavi se ponovo.':'');
  setInterval(authRecheck,RECHECK_MIN*60*1000);
  gdStart();
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)authRecheck()});
}
