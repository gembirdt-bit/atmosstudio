# Pravi Android APK i Windows instalaciju za Atmos Studio.
# - Ručno: Actions → „Android i Windows aplikacije“ → Run workflow (objavljuje Release)
# - Automatski: pri izmeni foldera android/ ili windows/ (fajlovi su u Artifacts)
# - Tag v* (npr. v1.6.0) → objavljuje Release
name: Android i Windows aplikacije

on:
  workflow_dispatch:
  push:
    branches: ['**']
    tags: ['v*']
    paths:
      - 'android/**'
      - 'windows/**'
      - '.github/workflows/aplikacije.yml'

permissions:
  contents: write

jobs:
  verzija:
    runs-on: ubuntu-latest
    outputs:
      ver: ${{ steps.v.outputs.ver }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        run: echo "ver=$(grep -oP "const VER='\K[^']+" index.html)" >> "$GITHUB_OUTPUT"

  android:
    needs: verzija
    runs-on: ubuntu-latest
    env:
      VERSION_NAME: ${{ needs.verzija.outputs.ver }}
      VERSION_CODE: ${{ github.run_number }}
      KEYSTORE_FILE: ${{ github.workspace }}/release.jks
      KEY_ALIAS: atmos
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Potpisni ključ
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PW" ]; then
            echo "$KS_B64" | base64 -d > "$KEYSTORE_FILE"
            echo "KEYSTORE_PASSWORD=$KS_PW" >> "$GITHUB_ENV"
          else
            echo "::warning::Nema tajni ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD — APK je potpisan PRIVREMENIM ključem (samo za probu; sledeća verzija neće moći da se instalira preko ove)."
            PW=privremeni$RANDOM$RANDOM
            keytool -genkeypair -storetype PKCS12 -keystore "$KEYSTORE_FILE" -alias atmos -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$PW" -keypass "$PW" -dname "CN=Atmos Studio test"
            echo "KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        working-directory: android
        run: gradle --no-daemon assembleRelease

      - name: APK i assetlinks.json
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/AtmosStudio.apk
          FP=$(keytool -list -v -keystore "$KEYSTORE_FILE" -storepass "$KEYSTORE_PASSWORD" | grep -oP 'SHA256: \K.*')
          printf '[{\n  "relation": ["delegate_permission/common.handle_all_urls"],\n  "target": {\n    "namespace": "android_app",\n    "package_name": "io.github.gembirdt_bit.atmosstudio",\n    "sha256_cert_fingerprints": ["%s"]\n  }\n}]\n' "$FP" > out/assetlinks.json
          echo "### Android APK ${VERSION_NAME} (versionCode ${VERSION_CODE})" >> "$GITHUB_STEP_SUMMARY"
          echo "SHA-256 potpisa: \`$FP\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v5
        with:
          name: android
          path: out/*

  windows:
    needs: verzija
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm version "${{ needs.verzija.outputs.ver }}" --no-git-tag-version --allow-same-version
      - run: npx electron-builder --win --x64 --publish never
      - uses: actions/upload-artifact@v5
        with:
          name: windows
          path: |
            windows/dist/AtmosStudio-Setup.exe
            windows/dist/AtmosStudio-Portable.exe

  objavi:
    needs: [verzija, android, windows]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: izlaz
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('aplikacije-v{0}-{1}', needs.verzija.outputs.ver, github.run_number) }}
          name: Atmos Studio ${{ needs.verzija.outputs.ver }} — Android i Windows
          target_commitish: ${{ github.sha }}
          body: |
            **Android:** preuzmi `AtmosStudio.apk` na telefon i otvori ga (dozvoli instalaciju iz nepoznatih izvora). Potreban je Chrome.
            **Windows:** `AtmosStudio-Setup.exe` je instalacija, `AtmosStudio-Portable.exe` radi bez instalacije. Ako Windows prikaže „Windows je zaštitio računar“, klikni **Više informacija → Ipak pokreni**.

            Obe aplikacije otvaraju sajt aplikacije i same se ažuriraju — nova verzija sajta stiže bez nove instalacije. Prvo pokretanje traži internet, posle radi i bez njega.
          make_latest: true
          files: |
            izlaz/*.apk
            izlaz/*.exe
            izlaz/assetlinks.json
