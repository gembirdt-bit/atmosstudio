# Objavljuje sajt aplikacije na GitHub Pages.
# Folder sajt/ sadrži samo minifikovanu verziju; čitljivi kod je u privatnom repou.
name: Sajt (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - 'sajt/**'
      - '.github/workflows/sajt.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  objavi:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: sajt
      - id: deploy
        uses: actions/deploy-pages@v4
