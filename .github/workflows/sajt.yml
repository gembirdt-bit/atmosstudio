# Objavljuje sajt aplikacije na GitHub Pages u minifikovanom obliku.
# Izvorni kod u repozitorijumu ostaje čitljiv; na sajt ide skraćena verzija iz tools/build.mjs.
# Podešavanje (jednom): Settings → Pages → Build and deployment → Source: GitHub Actions
name: Sajt (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  objavi:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm i --no-save --no-audit --no-fund esbuild@0.28
      - run: node tools/build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
