name: Premesti tag

on:
  workflow_dispatch:
    inputs:
      tag: { required: true }
      sha: { required: true }

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: gh api -X PATCH repos/${{ github.repository }}/git/refs/tags/${{ inputs.tag }} -f sha=${{ inputs.sha }} -F force=true
